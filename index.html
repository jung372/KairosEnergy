    tailwind.config = {
      theme: {
        extend: {
          colors: {
            deepgreen: {
              DEFAULT: '#064E3B',
              dark: '#022C22',
              light: '#065F46'

              dark: '#B8860B',
              light: '#F3E5AB'

    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    html {
      scroll-behavior: smooth;
    }
    
    /* 스크롤 페이드인 애니메이션 유틸리티 */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s ease-out, transform 0.8s ease-out;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    /* 그라데이션 텍스트용 클래스 */
    .text-gradient-gold {
      background: linear-gradient(to right, #D4AF37, #F3E5AB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    /* 커스텀 스크롤바 */
    ::-webkit-scrollbar {
      width: 10px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #064E3B;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #022C22;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased overflow-x-hidden">

       HTML 뼈대 및 구조 정의.
       데이터는 모두 비워두고(id 또는 data-속성), Logic Layer가 주입합니다.
       ========================================== -->
       
  <!-- GNB (Global Navigation Bar) -->

        <!-- Desktop Menu Container -->

        <!-- Mobile Menu Button -->
        <div class="md:hidden flex items-center">
          <button class="text-white hover:text-gold focus:outline-none">
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>

          </button>

      </div>
    </div>

  <main>

      </div>
      
      <!-- 메인 카피 컨테이너 -->

      </div>
    </section>

    <!-- Section 1: 수익 모델 도식화 -->

        <div class="text-center mb-20 fade-in">

        </div>

        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-12" id="tech-container"></div>
      </div>
    </section>
  </main>

  <!-- Footer & Contact -->
  <footer id="contact" class="bg-deepgreen-dark text-white pt-24 pb-12 relative overflow-hidden">
    <!-- 배경 장식 요소 -->
    <div class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 opacity-10 pointer-events-none">
      <div class="absolute -top-40 -right-40 w-96 h-96 rounded-full border border-gold"></div>
      <div class="absolute top-40 -left-20 w-72 h-72 rounded-full border border-gold"></div>
    </div>
    
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 relative z-10">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 mb-16">
        
        <!-- 회사 정보 -->

          <div id="company-info-container" class="space-y-4 text-gray-300 font-light">
            <!-- 데이터 주입 -->
          </div>
        </div>
        
        <!-- 상담 신청 폼 -->

          <h3 class="text-2xl font-bold mb-6 text-gold border-b border-white/10 pb-4">상담 신청</h3>
          <form id="contact-form" class="space-y-5" onsubmit="event.preventDefault(); alert('상담 신청이 완료되었습니다.');">
            <div>
              <label for="name" class="block text-sm font-medium text-gray-400 mb-1">성함 / 직책</label>
              <input type="text" id="name" class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-lg focus:outline-none focus:border-gold text-white placeholder-gray-500 transition-colors" placeholder="홍길동 대표">
            </div>
            <div>
              <label for="contact-info" class="block text-sm font-medium text-gray-400 mb-1">연락처 / 이메일</label>
              <input type="text" id="contact-info" class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-lg focus:outline-none focus:border-gold text-white placeholder-gray-500 transition-colors" placeholder="010-0000-0000 또는 email@domain.com">
            </div>
            <div>
              <label for="message" class="block text-sm font-medium text-gray-400 mb-1">문의 내용</label>
              <textarea id="message" rows="4" class="w-full px-4 py-3 bg-black/20 border border-white/10 rounded-lg focus:outline-none focus:border-gold text-white placeholder-gray-500 transition-colors resize-none" placeholder="보유하신 산지의 주소나 문의사항을 남겨주세요."></textarea>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-gold to-gold-dark hover:from-yellow-400 hover:to-yellow-600 text-deepgreen-dark font-extrabold py-4 px-6 rounded-lg transition-all duration-300 shadow-[0_4px_14px_0_rgba(212,175,55,0.39)] transform hover:-translate-y-1">
              자문 신청하기
            </button>
          </form>
        </div>
      </div>
      
      <!-- 카피라이트 -->
      <div class="pt-8 border-t border-white/10 text-center flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm text-gray-500 font-light" id="copyright-container"></p>
        <div class="flex space-x-6 text-sm text-gray-500 font-light">
          <a href="#" class="hover:text-gold transition-colors">이용약관</a>
          <a href="#" class="hover:text-gold transition-colors">개인정보처리방침</a>
        </div>
      </div>
    </div>
  </footer>

    /* ------------------------------------------
       [LOGIC LAYER]
       Data Layer의 정보를 읽어와 Presentation Layer의
       DOM 요소에 주입하고, UI 상호작용 이벤트를 처리합니다.
       ------------------------------------------ */
    const AppLogic = {
      
      // 1. Data -> DOM 렌더링
      renderData: function() {
        // GNB & Footer Branding
        document.getElementById('logo-container').innerHTML = `<img src="${AppData.branding.logoImage}" alt="${AppData.branding.companyName} 로고" class="h-16 md:h-20 w-auto object-contain transition-transform hover:scale-105">`;
        document.getElementById('footer-logo').innerHTML = `<img src="${AppData.branding.logoImage}" alt="${AppData.branding.companyName} 로고" class="h-20 md:h-24 w-auto object-contain">`;
        document.getElementById('footer-desc').innerText = AppData.branding.footerDesc;
        document.getElementById('copyright-container').innerText = AppData.branding.copyright;
        
        // GNB Menu
        const menuHtml = AppData.menu.map(item => 
          `<a href="#${item.id}" class="text-white hover:text-gold transition-colors duration-300 text-sm font-medium tracking-widest relative group">
            ${item.label}
            <span class="absolute -bottom-2 left-0 w-0 h-0.5 bg-gold transition-all duration-300 group-hover:w-full"></span>
          </a>`
        ).join('');
        document.getElementById('menu-container').innerHTML = menuHtml;

        // Hero Section
        document.getElementById('hero-bg').src = AppData.hero.bgImage;
        document.getElementById('hero-main-copy').innerHTML = AppData.hero.mainCopy;
        document.getElementById('hero-sub-copy').innerHTML = AppData.hero.subCopy;

        // Profit Model Section (4단계)
        const phasesHtml = AppData.profitModel.map((item, idx) => `
          <div class="relative bg-white p-8 rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-50 hover:-translate-y-2 hover:shadow-[0_20px_40px_rgb(0,0,0,0.08)] transition-all duration-300 fade-in z-10 group" style="transition-delay: ${idx * 150}ms">
            <div class="absolute -top-5 left-1/2 transform -translate-x-1/2 bg-deepgreen text-gold text-xs font-bold px-4 py-1.5 rounded-full shadow-md tracking-wider border border-white/10">
              ${item.phase}
            </div>
            <div class="mt-4 mb-6 flex justify-center transform group-hover:scale-110 transition-transform duration-300">
              <div class="p-4 bg-gray-50 rounded-full group-hover:bg-gold/10 transition-colors">
                ${item.icon}
              </div>
            </div>
            <h4 class="text-xl font-bold text-center text-gray-900 mb-3">${item.title}</h4>
            <p class="text-gray-500 text-center font-light leading-relaxed text-sm">${item.desc}</p>
          </div>
        `).join('');
        // 데스크톱 라인 유지를 위해 기존 내부 HTML에 append
        const phasesContainer = document.getElementById('phases-container');
        phasesContainer.insertAdjacentHTML('beforeend', phasesHtml);

        // Core Tech Section
        const techHtml = AppData.coreTech.map((item, idx) => `
          <div class="bg-white p-10 rounded-2xl shadow-sm border border-gray-100 hover:border-gold/50 transition-colors duration-300 fade-in group" style="transition-delay: ${idx * 150}ms">
            <div class="transform group-hover:-translate-y-2 transition-transform duration-300">
              ${item.icon}
            </div>
            <h4 class="text-2xl font-bold text-gray-900 mb-4">${item.title}</h4>
            <p class="text-gray-600 font-light leading-relaxed">${item.desc}</p>
          </div>
        `).join('');
        document.getElementById('tech-container').innerHTML = techHtml;

        // Contact Info
        const contactHtml = AppData.contactInfo.map(info => `
          <div class="flex items-start">
            <span class="w-20 font-medium text-gray-500">${info.label}</span>
            <span class="flex-1 text-gray-300">${info.value}</span>
          </div>
        `).join('');
        document.getElementById('company-info-container').innerHTML = contactHtml;
      },

      // 2. 이벤트 리스너 등록 (스크롤, 애니메이션 등)
      initEvents: function() {
        // Sticky Header Event
        const header = document.getElementById('gnb');
        window.addEventListener('scroll', () => {
          if (window.scrollY > 50) {
            header.classList.remove('bg-transparent', 'border-white/10', 'py-4');
            header.classList.add('bg-deepgreen-dark/95', 'backdrop-blur-md', 'shadow-lg', 'border-transparent', 'py-2');
          } else {
            header.classList.add('bg-transparent', 'border-white/10', 'py-4');
            header.classList.remove('bg-deepgreen-dark/95', 'backdrop-blur-md', 'shadow-lg', 'border-transparent', 'py-2');
          }
        });

        // Scroll Fade-in Animation Event (Intersection Observer)
        const observerOptions = {
          root: null,
          rootMargin: '0px 0px -100px 0px',
          threshold: 0.1
        };

        const observer = new IntersectionObserver((entries, observer) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('visible');
              observer.unobserve(entry.target); // 한 번 보이면 관찰 해제
            }
          });
        }, observerOptions);

        document.querySelectorAll('.fade-in').forEach(el => {
          observer.observe(el);
        });
      },

      // 초기화 함수
      init: function() {
        this.renderData();
        // DOM 렌더링 직후 이벤트를 바인딩하기 위해 약간의 지연
        setTimeout(() => {
          this.initEvents();
        }, 50);
      }
    };

    // DOM 트리가 완성되면 로직 실행
    document.addEventListener('DOMContentLoaded', () => {
      AppLogic.init();
    });
  </script>
</body>
</html>
